<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm your Guidon account</title>
</head>
<body style="margin:0; padding:24px 16px; background-color:#ffffff; color:#1f2937; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6;">
  <div style="max-width:520px; margin:0 auto;">
    <p style="margin:0 0 16px; font-size:17px; font-weight:600;">Confirm your email</p>
    <p style="margin:0 0 16px;">Confirm {{ .Email }} to finish creating your Guidon account.</p>
    <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="color:#1d4fd8; font-weight:600;">Confirm account</a></p>
    <p style="margin:0 0 24px; font-size:13px; color:#6b7280;">Link not working? Paste this into your browser:<br><a href="{{ .ConfirmationURL }}" style="color:#1d4fd8; word-break:break-all;">{{ .ConfirmationURL }}</a></p>
    <p style="margin:0; font-size:13px; color:#6b7280;">If you didn't create a Guidon account, you can safely ignore this email.</p>
    <p style="margin:16px 0 0; font-size:13px; color:#6b7280;">Guidon</p>
  </div>
</body>
</html>
