# Builds the Guidon Cloud image (Dockerfile, Supabase mode) on every push to
# main and pushes it to the repository's private GitHub registry:
#   ghcr.io/two-steps-studio/guidon:latest   and   :sha-<commit>
# The TrueNAS app (deploy/truenas-app.yaml, docs/truenas-app.md) pulls it,
# so the NAS no longer builds anything.
#
# The NEXT_PUBLIC_* values end up in the browser bundle, so they are public
# by nature and live as repository *variables* (Settings -> Secrets and
# variables -> Actions -> Variables), not secrets:
#   NEXT_PUBLIC_SUPABASE_URL  NEXT_PUBLIC_SUPABASE_ANON_KEY  NEXT_PUBLIC_APP_URL
#   NEXT_PUBLIC_APP_NAME (optional)  NEXT_PUBLIC_AUTH_PROVIDERS (optional)
#   NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN, NEXT_PUBLIC_POSTHOG_HOST (optional)
# Server secrets never enter the image: the app reads them at runtime from
# the NAS's .env.cloud.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Not set up for the image yet (none of the three set): skip quietly, so
      # every merge doesn't turn main red. Only some set: that's a mistake, fail.
      - name: Required variables are set
        id: config
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_ANON_KEY APP_URL; do
            [ -n "${!name}" ] || missing+=("NEXT_PUBLIC_$name")
          done
          if [ ${#missing[@]} -eq 3 ]; then
            echo "::notice::Image not built: set the repository variables from docs/truenas-app.md to turn it on."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Repository variables not set: ${missing[*]} (docs/truenas-app.md)"
            exit 1
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.config.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.config.outputs.build == 'true'
        name: Image name (lowercase, as the registry requires)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'Guidon' }}
            NEXT_PUBLIC_AUTH_PROVIDERS=${{ vars.NEXT_PUBLIC_AUTH_PROVIDERS }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
