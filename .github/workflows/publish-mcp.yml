name: Publish MCP Registry entry (manual)

on:
  pull_request:
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated manifest to the official MCP Registry
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guidon-mcp-registry-publishing
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'Two-Steps-Studio/guidon'
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish with repository-bound OIDC
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/server.json" ./server.json
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
          ./mcp-publisher publish server.json
