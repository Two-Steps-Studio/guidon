name: Release application E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'messages/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'tests/ai/**'
      - 'tests/*webhook*.mjs'
      - 'tests/agent-readiness.test.mjs'
      - 'tests/agent-web.test.mjs'
      - 'tests/fixtures/*app-paths*.mjs'
      - 'tests/web-bot-auth.test.mjs'
      - 'tests/auth/agent-claims.test.mjs'
      - 'tests/db/agent-claims.test.mjs'
      - 'tests/db/task-edit-revision.test.mjs'
      - 'docs/webhooks.md'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.*'
      - '.github/workflows/release-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:dependencies
      - run: npm run test:package
      - run: npm run test:auth
      - run: npm run test:ai
      - run: npm run test:webhooks
      - run: npm run test:agent-readiness
      - run: npm run test:agent-claims
      - run: npm run test:agent-web
      - run: npm run test:api
      - run: npm run test:feedback
      - run: node --experimental-strip-types tests/date-format.test.mjs
      - run: npm run test:db
      - run: npm run test:task-editing
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-application-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/e2e/run.mjs --accessibility-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-accessibility-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/e2e/run.mjs --mobile-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7
