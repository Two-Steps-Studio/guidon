name: Release application E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'messages/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'tests/ai/**'
      - 'tests/*webhook*.mjs'
      - 'tests/agent-readiness.test.mjs'
      - 'tests/search*.test.mjs'
      - 'tests/agent-web.test.mjs'
      - 'tests/avatar-image.test.mjs'
      - 'sdk/python/**'
      - 'tests/fixtures/*app-paths*.mjs'
      - 'tests/web-bot-auth.test.mjs'
      - 'tests/auth/agent-claims.test.mjs'
      - 'tests/db/agent-claims.test.mjs'
      - 'tests/db/task-edit-revision.test.mjs'
      - 'tests/migration-reporting.test.mjs'
      - 'tests/fixtures/migration-cli-pg.mjs'
      - 'docs/webhooks.md'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.*'
      - '.github/workflows/release-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/e2e/npm-command.test.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:dependencies
      - run: npm run test:package
      - run: npm run test:auth
      - run: npm run test:ai
      - run: npm run test:mcp-attachments
      - run: npm run test:images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python SDK regressions
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v
      - run: node --experimental-strip-types --import ./tests/fixtures/register-app-paths.mjs tests/pinned-task-order.test.mjs
      - run: npm run test:webhooks
      - run: npm run test:agent-readiness
      - run: npm run test:agent-claims
      - run: npm run test:agent-web
      - run: npm run test:api
      - run: npm run test:feedback
      # Pure-logic suites that had no CI step: billing + Stripe webhook flow, plan limits, reports, GitHub refs, labels/translations, import, recurrence.
      - run: npm run test:billing
      - run: npm run test:admin
      - run: npm run test:limits
      - run: npm run test:reports
      - run: npm run test:github
      - run: npm run test:labels
      - run: npm run test:import
      - run: npm run test:recurrence
      - run: npm run test:context
      - run: npm run test:search
      - run: npm run test:markdown
      - run: npm run test:csp
      - run: npm run test:app-changes
      - run: npm run test:agent-evidence
      - run: node --experimental-strip-types tests/date-format.test.mjs
      - run: npm run test:db
      - run: npm run test:migrations
      - run: npm run test:task-editing
      # Firefox and WebKit run in parallel in application-browsers.
      - run: node tests/e2e/isolation.test.mjs && node tests/e2e/run.mjs --browser=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-application-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7

  restore-drill:
    # Backup on one PostgreSQL 17 server, restore onto a brand-new one, verify (docs/backups.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guidon
          POSTGRES_PASSWORD: drill-only
          POSTGRES_DB: guidon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guidon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:restore
        env:
          DATABASE_URL: postgresql://guidon:drill-only@127.0.0.1:5432/guidon

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/e2e/npm-command.test.mjs
      - run: node tests/e2e/run.mjs --accessibility-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-accessibility-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/e2e/npm-command.test.mjs
      - run: node tests/e2e/run.mjs --mobile-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7
  write-safety:
    # Drafts, lost responses and sign-out across Chromium, Firefox and WebKit
    # (tests/e2e/write-safety.mjs); it never ran in CI, so a WebKit-only
    # failure went unseen (Guidon task 9037932e).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/e2e/run.mjs --write-safety
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: write-safety-e2e
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7

  application-browsers:
    # The same application e2e as the job above, in the other two browsers.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/e2e/run.mjs --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-application-e2e-${{ matrix.browser }}
          path: output/e2e/
          if-no-files-found: warn
          retention-days: 7
