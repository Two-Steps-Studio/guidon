name: Landing motion and pricing

on:
  pull_request:
    paths:
      - 'src/components/landing/**'
      - 'src/app/page.tsx'
      - 'src/app/pricing-section.tsx'
      - 'src/app/upgrade/**'
      - 'src/app/globals.css'
      - 'src/app/layout.tsx'
      - 'src/lib/billing/**'
      - 'messages/**'
      - 'tests/e2e/**'
      - 'tests/public-pricing.test.mjs'
      - 'package*.json'
      - '.github/workflows/landing-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:billing
      - run: node tests/e2e/run.mjs --landing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-evidence
          path: output/e2e/
          retention-days: 7
