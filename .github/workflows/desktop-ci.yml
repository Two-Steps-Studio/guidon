# Guidon Desktop checks on every change under desktop/: formatting, clippy
# and the unit tests (src-tauri/src/*.rs, incl. the plugin installer's
# zip-slip and path tests). Runs on Linux - cheaper than Windows, and the
# Rust code is the same; desktop-release.yml builds the Windows installers.
name: Desktop CI

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-*.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-*.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: cargo fmt --check
      - run: cargo clippy --lib --tests -- -D warnings
      - run: cargo test --lib
