<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guidon Desktop Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <h1>Guidon Desktop</h1>
      <p class="subtitle">
        Choose which Guidon server this app connects to.
      </p>

      <form id="settings-form">
        <label for="server-url">Server URL</label>
        <input
          id="server-url"
          name="server-url"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://useguidon.com"
        />
        <p id="hint" class="hint">
          Use Guidon Cloud, or point this at your own self-hosted Guidon
          server.
        </p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button type="submit" id="save-button">Save &amp; Reload</button>
      </form>
    </main>

    <script type="module" src="settings.js"></script>
  </body>
</html>
