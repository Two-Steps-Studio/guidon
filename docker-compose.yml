# =====================================================
# GUIDON — self-hosted (TODO.md §2, §3)
# =====================================================
#
#   cp .env.example .env
#   # uzupełnij .env
#   docker compose up -d
#
# Aktualizacja (§15):
#   docker compose pull && docker compose up -d
#
# Pełny self-hosting bez Supabase: DATABASE_URL włącza hasDirectDatabase(),
# a src/db/bootstrap/000_auth_compat.sql odtwarza auth.uid()/role na czystym
# Postgresie, więc te same 70+ polityk RLS obowiązują identycznie jak na
# Supabase (docs/self-hosting-audit.md, bloker 2 — rozwiązany, zweryfikowane
# przez `npm run test:db`). Ta usługa `app` nie potrzebuje Supabase w ogóle
# poza NEXT_PUBLIC_SUPABASE_* build argami, które zostają w bundlu tylko
# jako martwy kod, gdy DATABASE_URL jest ustawione.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guidon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD jest wymagane}
      POSTGRES_DB: ${POSTGRES_DB:-guidon}
    volumes:
      # Nazwany wolumen — dane przeżywają `docker compose down` (§30).
      - guidon-db:/var/lib/postgresql/data
    healthcheck:
      # Aplikacja i migracje czekają, aż baza faktycznie przyjmuje połączenia,
      # a nie tylko aż kontener wystartował.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guidon} -d ${POSTGRES_DB:-guidon}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Port nie jest publikowany — baza jest dostępna tylko w sieci compose.
    # Do debugowania: docker compose exec db psql -U guidon

  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Guidon}
        NEXT_PUBLIC_AUTH_PROVIDERS: ${NEXT_PUBLIC_AUTH_PROVIDERS:-}
        # Same build args as `app` below, kept identical so both services
        # build from the same cached image layers instead of two separate
        # builds.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    # Jednorazowa: stosuje migracje i kończy pracę. Aplikacja startuje
    # dopiero po jej pomyślnym zakończeniu, więc schemat nigdy nie jest
    # o krok w tyle za kodem (§13, §15).
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guidon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-guidon}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Guidon}
        NEXT_PUBLIC_AUTH_PROVIDERS: ${NEXT_PUBLIC_AUTH_PROVIDERS:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guidon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-guidon}

      # Sekrety wstrzykiwane w runtime, nigdy wkompilowane w obraz (§10).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET jest wymagane — openssl rand -hex 32}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_PATH: /app/storage

      # Server-only counterpart of the NEXT_PUBLIC_APP_URL build arg above -
      # read at runtime by lib/site-url.ts for metadataBase, robots.ts, and
      # sitemap.ts. Without this, a self-hosted instance silently fell back
      # to site-url.ts's own useguidon.com default and advertised the wrong
      # origin in its own meta tags/robots.txt/sitemap.xml.
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-3000}}

      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # Each provider factory (src/lib/ai/providers/*.ts) reads its own named
      # key - none of them fall back to a shared variable - so every one has
      # to be passed through here or that provider's AI_PROVIDER value is
      # silently unusable in Compose even though it works with `npm run dev`
      # reading .env.local directly. AI_API_KEY is "custom" only; ollama needs
      # none of these.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}

      # Read at runtime by src/instrumentation.ts. NEXT_PUBLIC_SENTRY_DSN
      # (the browser's copy) is a build arg above instead, since it has to
      # be embedded in the client bundle.
      SENTRY_DSN: ${SENTRY_DSN:-}

      # Guidon Cloud billing only (src/lib/billing/stripe.ts) - unset means
      # the billing page shows a read-only plan table, no purchase path.
      # Runtime only, not a build arg: unlike NEXT_PUBLIC_SENTRY_DSN above,
      # neither of these is embedded in the client bundle.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      # Uploady muszą przeżyć restart kontenera (§30).
      - guidon-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  guidon-db:
  guidon-storage:
